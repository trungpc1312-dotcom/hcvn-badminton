<style id="app-css">
:root{
  --bg:#F4F4F4; --card:#FFFFFF; --ink:#404041; --muted:#6B6B6B; --line:#E3E3E3;
  --brand:#E01932; --brand-ink:#FFFFFF; --tile:#404041; --tile-ink:#FFFFFF; --accent:#E01932; --accent-bg:#E01932;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141213; --card:#1F1B1C; --ink:#F2EEEF; --muted:#A8A0A2; --line:#383133;
  --brand:#1F1B1C; --brand-ink:#F2EEEF; --tile:#332D2F; --tile-ink:#F2EEEF; --accent:#FF5C70; --accent-bg:#C8162C;
  --hero:#332D2F; --hero-ink:#F2EEEF; --hero-btn:#404041; --icbtn:var(--bg); --hdr-line:var(--line);
  --court:#E6E1E2; --court-ink:#1A1718; --court-soft:#2E2A2B;
  --cork:#BDB6B8; --cork-soft:#2E2A2B;
  --good:#E6E1E2; --good-soft:#2E2A2B; --bad:#FF7A8A; --bad-soft:#3D1A1F; --warn:#FF8E9B; --warn-soft:#3D1A1F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141213; --card:#1F1B1C; --ink:#F2EEEF; --muted:#A8A0A2; --line:#383133;
  --brand:#1F1B1C; --brand-ink:#F2EEEF; --tile:#332D2F; --tile-ink:#F2EEEF; --accent:#FF5C70; --accent-bg:#C8162C;
  --hero:#332D2F; --hero-ink:#F2EEEF; --hero-btn:#404041; --icbtn:var(--bg); --hdr-line:var(--line);
  --court:#E6E1E2; --court-ink:#1A1718; --court-soft:#2E2A2B;
  --cork:#BDB6B8; --cork-soft:#2E2A2B;
  --good:#E6E1E2; --good-soft:#2E2A2B; --bad:#FF7A8A; --bad-soft:#3D1A1F; --warn:#FF8E9B; --warn-soft:#3D1A1F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cork);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);border-bottom:1px solid var(--hdr-line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:6px}
.logo{width:40px;height:46px;flex:none}
.tname{font-weight:800;font-size:clamp(16px,4.6vw,18px);letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:12px;opacity:.8;font-weight:600;line-height:1.2}
.icbtn.plain{background:none;width:40px;height:40px;margin-right:-8px}
.icbtn.plain svg{width:24px;height:24px}
.menu-scrim{position:fixed;inset:0;z-index:45}
.menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);right:max(12px,calc((100vw - 620px)/2 + 12px));z-index:46;background:var(--card);color:var(--ink);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px;min-width:200px;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:left;padding:12px;border-radius:10px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:12px;color:inherit}
.menu button svg{width:20px;height:20px;color:var(--muted)}
.menu button:active{background:var(--bg)}
.grow{flex:1;min-width:0}
.icbtn{border:0;background:var(--icbtn);color:inherit;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.icbtn svg{width:20px;height:20px}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.sec-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
h2{font-size:17px;margin:0;font-weight:700;text-wrap:balance}
h3{font-size:13px;margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font-size:17px}
.mbtn{border:1px solid var(--line);background:var(--card);width:40px;height:40px;border-radius:12px;font-size:20px;line-height:1}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:600}
.hero .big{font-size:clamp(22px,6.6vw,26px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero .row{display:flex;flex-wrap:wrap;gap:8px}
.hero .chip{background:rgba(255,255,255,.18);color:inherit}
.hero .top{display:flex;gap:8px;align-items:flex-start}
.hero .top>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hero .mascot{width:clamp(70px,21vw,92px);height:auto;flex:none;margin:-6px -6px -10px 0;pointer-events:none}
.logo{object-fit:contain}
.guide-mascot{width:120px;height:auto;align-self:center}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--court);color:var(--court-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:44px}
.btn.ghost{background:var(--court-soft);color:var(--court)}
.btn.light{background:#fff;color:var(--hero-btn)}
.btn.light svg{color:#E01932}
.btn.cork{background:var(--court-soft);color:var(--court)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled,.mbtn:disabled{opacity:.35;cursor:default}
.btnrow .btn{text-align:center}
.hero .btnrow .btn{flex:1 1 0;min-width:0;padding-inline:8px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;white-space:nowrap;flex:none}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-weight:600}
.alert b{font-size:16px}
.paybox{display:flex;flex-direction:column;gap:10px}
.payrow{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg);border-radius:12px;padding:10px 12px}
.payrow .k{font-size:12px;color:var(--muted);font-weight:600}
.payrow .v{font-weight:700;font-size:17px;word-break:break-all}
.qr{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:12px}
.qr img{max-width:100%;max-height:380px;width:auto;height:auto;display:block;border-radius:8px;cursor:zoom-in}
.qr-full{background:#fff;border-radius:12px;padding:8px}
.qr-full img{width:100%;height:auto;display:block}
.qr .hint{color:#5F6E66;text-align:center}
.qr-edit{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.qr-edit img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
details.fold{background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
details.fold>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"›";font-size:22px;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(-90deg)}
details.fold>.in{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.hero[data-act]{cursor:pointer}
.hero .tap{font-size:12px;opacity:.8}
.upd{font-size:12px;color:var(--muted);text-align:center;margin:0}
.inline-form{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--line)}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow .btn{flex:1 1 140px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--court-soft);color:var(--court);white-space:nowrap}
.chip.cork{background:var(--cork-soft);color:var(--cork)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.grey{background:var(--line);color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.date{width:52px;flex:none;text-align:center;border-radius:12px;background:var(--court-soft);color:var(--court);padding:6px 0}
.date b{display:block;font-size:20px;line-height:1.1}
.date span{font-size:11px;font-weight:600;text-transform:uppercase}
.date.off{background:var(--line);color:var(--muted)}
.item .t{font-weight:700}
.item .s{font-size:13px;color:var(--muted)}
.strike{text-decoration:line-through}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--court-soft);color:var(--court)}
.avatar.w{background:var(--cork-soft);color:var(--cork)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.tile.main{grid-column:1/-1;background:var(--tile);color:var(--tile-ink)}
.tile.main .k{color:inherit;opacity:.85}
.tile.main .v{font-size:28px}
.tile.main.low{background:var(--accent-bg);color:#fff}
.pos{color:var(--good)} .neg{color:var(--bad)}
.money{font-weight:700;white-space:nowrap}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.5}
.names{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cork);border-radius:6px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mode{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--icbtn)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;align-items:center;gap:10px;position:sticky;top:-8px;background:var(--bg);padding:8px 0;z-index:2}
.sheet-h h2{flex:1}
.x{border:0;background:var(--line);width:36px;height:36px;border-radius:50%;font-size:18px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-height:46px;width:100%;font-size:16px}
.field textarea{min-height:80px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two .field{min-width:0}
.field input[type=date],.field input[type=month],.field input[type=time]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.check{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.check input{width:22px;height:22px;accent-color:var(--court);flex:none}
.check .grow{font-weight:600}
.checks{display:flex;flex-direction:column;gap:6px}
.courts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.court-chip{display:inline-flex;align-items:center;gap:6px;background:var(--court);color:var(--court-ink);border-radius:10px;padding:6px 6px 6px 12px;font-weight:700}
.court-chip button{border:0;background:rgba(255,255,255,.25);color:inherit;width:26px;height:26px;border-radius:8px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;max-width:90%;text-align:center}
.saving{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:grid;place-items:center}
.saving div{background:var(--card);padding:16px 22px;border-radius:14px;font-weight:700;box-shadow:var(--shadow)}
.guide-step{display:flex;gap:12px;align-items:flex-start}
.guide-step .n{width:28px;height:28px;border-radius:50%;background:var(--court);color:var(--court-ink);display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-weight:600}

.tl{display:flex;gap:6px;overflow-x:auto;position:relative;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tl::-webkit-scrollbar{display:none}
.tl button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tl button[aria-pressed="true"]{background:var(--court);color:var(--court-ink);border-color:var(--court)}
.tiles.mini .k{font-size:11px;letter-spacing:.03em;white-space:nowrap}
.vbars{display:flex;align-items:flex-end;gap:4px;height:140px;margin-top:10px}
.vbars>div{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.vbars i{display:block;width:100%;max-width:30px;background:var(--court);border-radius:6px 6px 2px 2px;min-height:3px}
.vbars b{font-size:12px;line-height:1}
.vbars span{font-size:11px;color:var(--muted);white-space:nowrap}
.vbars.dense span{font-size:9px;letter-spacing:-.02em}

.plist{display:flex;flex-direction:column;margin-top:4px}
.prow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .t{font-weight:700}
.prow .amt{font-weight:700;font-size:16px;white-space:nowrap;text-align:right}
.prow .unset{font-size:12px;color:var(--muted);font-weight:600}
.ptick{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin:0;flex:none;border:2px solid var(--muted);border-radius:8px;background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative}
.ptick::before{content:"";position:absolute;inset:-8px}
.ptick:checked{background:var(--court);border-color:var(--court)}
.ptick:checked::after{content:"";width:7px;height:13px;border:solid var(--court-ink);border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sugs:empty{display:none}
.sugs .chip{border:0;padding:7px 12px;font-size:14px;cursor:pointer}
.chip.pick{background:var(--line);color:var(--ink);border:0;padding:8px 14px;font-size:15px;cursor:pointer}
.chip.pick[aria-pressed="true"]{background:var(--court);color:var(--court-ink)}
.chip.pick[aria-pressed="true"]::before{content:"✓";margin-right:6px;font-weight:800}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:4px 0;cursor:pointer}
.field select{appearance:auto}
.ptick:disabled{opacity:.35;cursor:default}
.tickbox{width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;opacity:.6}
.tickbox.on{background:var(--court);border-color:var(--court);color:var(--court-ink);opacity:1}
table.debt{width:100%;border-collapse:collapse;font-size:14px}
table.debt td{padding:9px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.debt tr:first-child td{border-top:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

function monthNav(minM){
  var m=curMonth();

}
function courtsTxt(c){return c&&c.length?'Sân số '+c.join(', '):'Chưa chọn sân'}
function zaloBtn(cls){

}

}
function payDeadline(){var d=+S.settings.payDay;return d>=1&&d<=31?'Đóng trước ngày '+d+' mỗi tháng':''}

function chart6(m){
  var months=[];for(var i=5;i>=0;i--)months.push(mAdd(m,-i));
  var data=months.map(function(x){return{m:x,i:income(x),e:expense(x)}});
  var max=Math.max.apply(null,data.map(function(d){return Math.max(d.i,d.e)}).concat([1]));
  var noData=data.every(function(d){return !d.i&&!d.e});
  var W=340,H=190,pl=40,pb=26,pt=12,cw=(W-pl-6)/6,bw=Math.min(16,cw/3);
  function y(v){return pt+(H-pt-pb)*(1-v/max)}
  var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Thu chi 6 tháng">';
  [0,.5,1].forEach(function(f){var v=max*f;svg+='<line x1="'+pl+'" x2="'+(W-4)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+moneyShort(Math.round(v))+'</text>'});
  data.forEach(function(d,j){
    var cx=pl+cw*j+cw/2;
    svg+='<rect x="'+(cx-bw-1)+'" y="'+y(d.i)+'" width="'+bw+'" height="'+Math.max(0,y(0)-y(d.i))+'" rx="3" fill="var(--accent)"/>';
    svg+='<rect x="'+(cx+1)+'" y="'+y(d.e)+'" width="'+bw+'" height="'+Math.max(0,y(0)-y(d.e))+'" rx="3" fill="var(--cork)"/>';
    var p=d.m.split('-');svg+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" font-weight="'+(d.m===m?700:400)+'" fill="'+(d.m===m?'var(--ink)':'var(--muted)')+'">T'+(+p[1])+'</text>';
  });
  svg+='</svg>';
  return noData?'<div class="empty">Chưa có khoản thu chi nào trong 6 tháng này.</div>':'<div class="legend" style="margin:4px 0 6px"><span><i style="background:var(--accent)"></i>Thu</span><span><i style="background:var(--cork)"></i>Chi</span></div>'+svg;
}

function findQrBox(img){
  var W=360,k=W/img.naturalWidth,H=Math.round(img.naturalHeight*k);if(H<40)return null;
  var c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(img,0,0,W,H);
  var d;try{d=g.getImageData(0,0,W,H).data}catch(e){return null}
  function dark(x,y){var i=(y*W+x)*4;return d[i]*.3+d[i+1]*.59+d[i+2]*.11<110}
  function band(n,count,minT){var best=[0,-1],st=-1,gap=0;for(var i=0;i<n;i++){var ok=count(i)>=minT;if(ok){if(st<0)st=i;gap=0}else if(st>=0){gap++;if(gap>Math.max(3,n*0.015)){var e=i-gap;if(e-st>best[1]-best[0])best=[st,e];st=-1;gap=0}}}
    if(st>=0){var e2=n-1-gap;if(e2-st>best[1]-best[0])best=[st,e2]}return best}
  var rows=band(H,function(y){var t=0,p=dark(0,y);for(var x=1;x<W;x++){var q=dark(x,y);if(q!==p)t++;p=q}return t},8);
  if(rows[1]-rows[0]<W*0.25)return null;
  var cols=band(W,function(x){var t=0,p=dark(x,rows[0]);for(var y=rows[0]+1;y<=rows[1];y++){var q=dark(x,y);if(q!==p)t++;p=q}return t},8);
  var bw=cols[1]-cols[0],bh=rows[1]-rows[0];if(bw<W*0.25||bw/bh<0.7||bw/bh>1.4)return null;
  if(bw>W*0.97&&bh>H*0.9)return null;
  var m=Math.round(Math.max(bw,bh)*0.08);
  var x0=Math.max(0,cols[0]-m),y0=Math.max(0,rows[0]-m),x1=Math.min(W,cols[1]+m),y1=Math.min(H,rows[1]+m);
  return {x:x0/k,y:y0/k,w:(x1-x0)/k,h:(y1-y0)/k};
}
function imgToData(img,box){
  box=box||{x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
  var max=1400,k=Math.min(1,max/Math.max(box.w,box.h));
  var c=document.createElement('canvas');c.width=Math.round(box.w*k);c.height=Math.round(box.h*k);
  var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.imageSmoothingEnabled=true;g.drawImage(img,box.x,box.y,box.w,box.h,0,0,c.width,c.height);

  return out;
}
function shrinkImage(file,cb){

        cb(box?imgToData(img,box):imgToData(img),box?imgToData(img):null)}catch(e){cb(null)}

}

 save(json,priv){const b=writeBatch(db),at=new Date().toISOString();b.set(ref,{json,at});b.set(doc(db,"meta","leader"),{json:priv,at});return b.commit()},
 onAuth(cb){onAuthStateChanged(auth,cb)},
 isLeader(){return getDoc(doc(db,"meta","leader")).then(s=>{let priv=null;try{priv=s.exists()?JSON.parse(s.data().json):null}catch(e){}return {ok:true,priv}},()=>({ok:false}))},
 signIn(){return signInWithPopup(auth,new GoogleAuthProvider())},
 signOut(){return signOut(auth)}
};
if(window.__appFB)window.__appFB(window.FB);
</script>
